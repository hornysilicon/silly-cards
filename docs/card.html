<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card — Horny Silicon's ST Cards</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container narrow">

    <a class="backlink" href="index.html">&larr; All cards</a>

    <header class="detail-head" id="head">
      <div class="kicker" id="d-kicker"></div>
      <h1 id="d-name"></h1>
      <div class="ornament"><span class="diamond"></span></div>
      <p class="tagline" id="d-tagline"></p>
      <div class="meta-row" id="d-meta"></div>
      <ul class="chips" id="d-tags" style="justify-content:center"></ul>
    </header>

    <figure class="hero-figure" id="d-hero" hidden>
      <img id="d-hero-img" src="" alt="">
      <figcaption id="d-hero-cap"></figcaption>
    </figure>

    <div id="dd-detail" hidden></div>

    <div id="default-detail">
      <div class="section-title" id="blurb-title">The Scenario</div>
      <div class="prose" id="d-blurb"></div>

      <div class="section-title">Notes</div>
      <div class="prose" id="d-notes"></div>

      <div id="d-cast-block" hidden>
        <div class="section-title">Dramatis Personae</div>
        <div class="cast" id="d-cast"></div>
      </div>

      <div id="d-party-block" hidden>
        <div class="section-title">Dramatis Personae</div>
        <div class="party-sub" id="d-party-sub"></div>
        <div class="party" id="d-party"></div>
      </div>
    </div>

    <div class="download-bar">
      <a class="btn" id="d-dl" href="#" download>Download card</a>
      <a class="alt" id="d-src" href="#">view source on GitHub</a>
    </div>

    <footer>
      Cards and presets by Horny Silicon ·
      <a href="https://github.com/hornysilicon/silly-cards">view the repository</a>
    </footer>

  </div>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Portrait viewer">
    <button class="lb-btn lb-close" id="lb-close" aria-label="Close">&times;</button>
    <button class="lb-btn lb-prev" id="lb-prev" aria-label="Previous portrait">&#8249;</button>
    <figure class="lb-figure">
      <img id="lb-img" src="" alt="">
      <figcaption id="lb-cap"></figcaption>
    </figure>
    <button class="lb-btn lb-next" id="lb-next" aria-label="Next portrait">&#8250;</button>
  </div>

  <script src="data.js?v=5"></script>
  <script>
    const qs = new URLSearchParams(location.search);
    const card = CARDS.find(c => c.id === qs.get('id')) || CARDS[0];
    document.title = `${card.name} — Horny Silicon's ST Cards`;

    document.getElementById('d-kicker').textContent = card.kicker;
    document.getElementById('d-name').textContent = card.name;
    document.getElementById('d-tagline').innerHTML = card.tagline;
    document.getElementById('blurb-title').textContent = card.kicker.includes('character') ? 'The Character' : 'The Scenario';
    document.getElementById('d-blurb').innerHTML = `<p>${card.blurb}</p>`;
    document.getElementById('d-notes').innerHTML = `<p>${card.notes}</p>`;
    document.getElementById('d-meta').innerHTML =
      `<span>${card.date}</span><span>·</span><span>${card.greetings} greeting${card.greetings > 1 ? 's' : ''}</span>` +
      (card.link ? `<span>·</span><a href="${card.link}" target="_blank" rel="noopener">${card.linkLabel || 'reference'}</a>` : '');
    document.getElementById('d-tags').innerHTML = card.tags.map(t => `<li>${t}</li>`).join('');
    document.getElementById('d-dl').href = rawURL(card.file);
    document.getElementById('d-src').href = blobURL(card.file);

    if (card.poster) {
      const hero = document.getElementById('d-hero');
      hero.hidden = false;
      const img = document.getElementById('d-hero-img');
      img.src = card.poster; img.alt = card.name;
      document.getElementById('d-hero-cap').textContent = card.posterCaption || card.name;
    }

    if (card.characters) {
      document.getElementById('d-cast-block').hidden = false;
      const cast = document.getElementById('d-cast');
      for (const ch of card.characters) {
        const pic = ch.img
          ? `<div class="pic"><img src="${ch.img}" alt="${ch.name}" loading="lazy"></div>`
          : `<div class="pic">${ch.name.replace(/^Lady |^Dr\. /, '')[0]}</div>`;
        const row = document.createElement('div');
        row.className = 'cast-row';
        row.innerHTML = `${pic}<div class="info"><div class="name">${ch.name}</div><div class="line">${ch.line}</div></div>`;
        cast.appendChild(row);
      }
    }

    const lbList = [];
    if (card.party) {
      document.getElementById('d-party-block').hidden = false;
      document.getElementById('d-party-sub').textContent = card.partySubtitle || '';
      const party = document.getElementById('d-party');
      const partyColors = ['#d9a03f', '#b3a1ce', '#6fb3a0', '#e0863f'];
      card.party.forEach((ch, i) => {
        const row = document.createElement('div');
        row.className = 'party-panel ' + (i % 2 === 0 ? 'img-right' : 'img-left');
        row.style.setProperty('--pc', ch.color || partyColors[i % 4]);
        row.innerHTML =
          '<div class="inner">' +
            `<img src="${ch.img}" alt="${ch.name}" loading="lazy">` +
            '<div class="pinfo">' +
              `<div class="pname">${ch.name}</div>` +
              `<div class="pepithet">${ch.epithet}</div>` +
              ch.stats.map(([k, v]) => `<div class="pstat"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('') +
              `<p class="desc">${ch.desc}</p>` +
              `<p class="quote">${ch.quote}</p>` +
            '</div>' +
          '</div>';
        row.querySelector('img').addEventListener('click', () => lbOpen(i));
        party.appendChild(row);
        lbList.push({
          name: ch.name, epithet: ch.epithet,
          full: ch.img.replace('/eldoria/', '/eldoria/full/')
        });
      });
    }

    // Lightbox for the party portraits.
    const lb = document.getElementById('lightbox');
    const lbImg = document.getElementById('lb-img');
    const lbCap = document.getElementById('lb-cap');
    let lbIdx = 0;

    function lbShow(i) {
      lbIdx = ((i % lbList.length) + lbList.length) % lbList.length;
      const ch = lbList[lbIdx];
      lbImg.src = ch.full;
      lbImg.alt = ch.name;
      lbCap.textContent = ch.epithet ? `${ch.name} — ${ch.epithet}` : ch.name;
    }
    function lbOpen(i) {
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
      lbShow(i);
      document.getElementById('lb-close').focus();
    }
    function lbClose() {
      lb.classList.remove('open');
      document.body.style.overflow = '';
    }

    lb.addEventListener('click', e => { if (e.target === lb) lbClose(); });
    document.getElementById('lb-close').addEventListener('click', lbClose);
    document.getElementById('lb-prev').addEventListener('click', () => lbShow(lbIdx - 1));
    document.getElementById('lb-next').addEventListener('click', () => lbShow(lbIdx + 1));
    document.addEventListener('keydown', e => {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') lbClose();
      else if (e.key === 'ArrowLeft') lbShow(lbIdx - 1);
      else if (e.key === 'ArrowRight') lbShow(lbIdx + 1);
    });

    // Cards with detail: 'notes' (D&D Succs, Twisted World) render the card's
    // own creator-notes page. Local preview: try the repo-root JSON next to
    // docs/ (works when serving the repo root). On Pages that path 404s and we
    // fall back to raw main.
    if (card.detail === 'notes') {
      const mount = document.getElementById('dd-detail');
      fetch(`../${encodeURIComponent(card.file)}`)
        .catch(() => fetch(rawURL(card.file)))
        .then(r => r && r.ok ? r : fetch(rawURL(card.file)))
        .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(j => {
          let html = j.creatorcomment || (j.data && j.data.creator_notes) || '';
          const rawImg = p => `https://raw.githubusercontent.com/${SITE.user}/${SITE.repo}/${SITE.branch}/images/${p}`;
          for (const [from, to] of Object.entries(card.imgMap || {})) {
            html = html.split(rawImg(from)).join(to);
          }
          mount.innerHTML = html;
          // Lightbox: same viewer as the party portraits.
          mount.querySelectorAll('img').forEach((img, i) => {
            lbList.push({
              name: img.alt || 'Illustration',
              full: img.getAttribute('src').replace(/^(assets\/images\/[^/]+)\//, '$1/full/')
            });
            img.addEventListener('click', () => lbOpen(i));
          });
          mount.hidden = false;
          document.getElementById('default-detail').hidden = true;
        })
        .catch(() => { /* fall back to the default layout */ });
    }
  </script>
</body>
</html>
